<!DOCTYPE html>
<html lang="de-CH"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StV-Visum"><meta name="theme-color" content="#534AB7">
<title>StV-Visum · Leitung</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="shared.css?v=6">
<script src="qrlib.js?v=6"></script><script src="shared.js?v=6"></script>
</head><body class="lei"><div class="wrap" id="app"></div><div class="note center" style="margin:-70px 0 30px">Demo-Version 6 · 20.11.2026</div>
<script>
const KEY = 'lei_data_v1';
let D = store(KEY, { setup: null, salt: null, stammHash: null, ferien: null, visa: [], letzterExport: null, versuche: { n: 0, sperreBis: 0 } });
const persist = () => save(KEY, D);
askPersist();
const app = $('#app');
let ROLE = null, lastName = '', idleT = null;
let pendingSetup = null; // Demo: Einrichtung über Link leitung.html#setup=…
if (location.hash.startsWith('#setup=')) { pendingSetup = decodeURIComponent(location.hash.slice(7)); history.replaceState(null, '', location.pathname); }
const isStamm = () => ROLE === 'stamm';
const sName = () => standortName(D.setup.standortNr);
const head = (t, back) => `${back ? '<button class="back" id="b0">‹ Zurück</button>' : '<a class="back" href="index.html">‹ Startseite</a>'}<header class="top"><div><h1>${t}</h1><div class="sub">${esc(sName())}</div></div><span class="role">${ROLE === 'ferien' ? 'Ferien-PIN' : 'Leitungsmodus'}</span></header>`;
const pinHash = pin => sha256Hex(D.salt + '|' + pin);
function bumpIdle() { clearTimeout(idleT); if (ROLE) idleT = setTimeout(() => { ROLE = null; toast('Automatisch gesperrt'); viewLock(); }, 5 * 60 * 1000); }
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, bumpIdle, { passive: true }));

/* ---------- PIN-Tastatur ---------- */
function pinPad(el, len, onDone) {
  let v = '';
  el.innerHTML = `<div class="pindots">${'<i></i>'.repeat(len)}</div><div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k}</button>`).join('')}</div>`;
  const dots = $$('.pindots i', el);
  const draw = () => dots.forEach((d, i) => d.classList.toggle('f', i < v.length));
  $$('button', el).forEach(b => b.onclick = () => {
    if (b.dataset.k === '⌫') v = v.slice(0, -1); else if (v.length < len) v += b.dataset.k;
    draw(); if (v.length === len) { const x = v; v = ''; setTimeout(() => { draw(); onDone(x); }, 120); }
  });
}

/* ---------- Einrichtung ---------- */
function viewSetup(neu) {
  app.innerHTML = `${neu ? '<button class="back" id="b0">‹ Zurück</button>' : '<a class="back" href="index.html">‹ Startseite</a>'}<header class="top"><h1>Betreuungshandy einrichten</h1><span class="role">Leitungsmodus</span></header>
  ${!window.navigator.standalone && !matchMedia('(display-mode: standalone)').matches ? '<div class="info"><b>Zuerst:</b> Diese Seite zum Home-Bildschirm hinzufügen und von dort öffnen. Erst dann einrichten: Nur so bleiben die Visa sicher gespeichert.</div>' : ''}
  <div class="card"><p>Die Administration gibt für jede Betreuung einen <b>Einrichtungs-QR-Code</b> mit dem Standort-Schlüssel ab.</p>
    <button class="pri" id="sc">Einrichtungs-QR-Code scannen</button>
    <label class="l" style="margin-top:16px">oder Einrichtungs-Code einfügen</label><textarea id="tx" class="mono" rows="2" placeholder="LS1:…" autocapitalize="off" autocorrect="off" spellcheck="false" style="resize:none"></textarea>
    <div class="err" id="err"></div><button id="ok">Weiter</button>
    ${neu ? '<button id="back">Abbrechen</button>' : ''}</div>`;
  const use = txt => {
    const p = parseSetup(txt);
    if (p.err) return $('#err').textContent = p.err;
    const nr = p.nr, m = [null, p.nr, p.keyId, p.secret]; if (!CONFIG.standorte.some(s => s.nr === nr)) return $('#err').textContent = 'Unbekannter Standort im Code.';
    if (D.setup && D.setup.standortNr !== nr && D.visa.length && !confirm('Achtung: Dieses Handy war für ' + standortName(D.setup.standortNr) + ' eingerichtet. Wirklich auf ' + standortName(nr) + ' wechseln? Bitte vorher die Visa exportieren.')) return;
    D.setup = { standortNr: nr, keyId: +m[2], secret: m[3], eingerichtet: nowLocalISO() };
    if (neu && D.stammHash) { persist(); toast('Neuer Schlüssel gespeichert'); return viewHome(); }
    viewNewPin();
  };
  $('#sc').onclick = async () => { const t = await scanQR('Einrichtungs-QR-Code scannen'); if (t) use(t); };
  $('#ok').onclick = () => use($('#tx').value);
  if ($('#back')) $('#back').onclick = viewHome;
  if ($('#b0')) $('#b0').onclick = viewHome;
  if (pendingSetup) { $('#tx').value = pendingSetup; pendingSetup = null; use($('#tx').value); }
}
function viewNewPin(change) {
  app.innerHTML = `${change ? '<button class="back" id="b0">‹ Zurück</button>' : ''}<header class="top"><h1>${change ? 'Stamm-PIN ändern' : 'Stamm-PIN festlegen'}</h1><span class="role">Leitungsmodus</span></header>
  <div class="card center"><p id="t">Wähle eine 4-stellige PIN für das Leitungsteam von <b>${esc(sName())}</b>.</p><div id="pp"></div><div class="err" id="err"></div></div>
  ${change ? '<button id="back">Abbrechen</button>' : ''}`;
  let first = null;
  pinPad($('#pp'), 4, async pin => {
    if (!first) { if (/^(\d)\1{3}$/.test(pin) || '0123456789'.includes(pin)) return $('#err').textContent = 'Bitte keine zu einfache PIN wie 1111 oder 1234.';
      first = pin; $('#t').textContent = 'PIN zur Bestätigung nochmals eingeben.'; $('#err').textContent = ''; return; }
    if (pin !== first) { first = null; $('#t').textContent = 'Die PINs waren nicht gleich. Bitte neu beginnen.'; return; }
    D.salt = D.salt || randomB32(16); D.stammHash = await pinHash(pin);
    if (D.ferien && D.ferien.hash === D.stammHash) D.ferien = null;
    persist(); ROLE = 'stamm'; bumpIdle(); toast(change ? 'Stamm-PIN geändert' : 'Betreuungshandy ist eingerichtet'); viewHome();
  });
  if ($('#back')) $('#back').onclick = viewHome;
  if ($('#b0')) $('#b0').onclick = viewHome;
}

/* ---------- Sperrbildschirm ---------- */
function viewLock() {
  ROLE = null;
  app.innerHTML = `<a class="back" href="index.html">‹ Startseite</a><header class="top"><div><h1>Leitungsmodus</h1><div class="sub">${esc(sName())}</div></div><span class="role">gesperrt</span></header>
  <div class="card center"><p>PIN eingeben</p><div id="pp"></div><div class="err" id="err"></div></div>
  <p class="note center">Stamm-PIN für das Leitungsteam oder Ferien-PIN während der Ferienbetreuung.</p>`;
  pinPad($('#pp'), 4, async pin => {
    const now = Date.now();
    if (D.versuche.sperreBis > now) return $('#err').textContent = 'Zu viele Versuche. Bitte ' + Math.ceil((D.versuche.sperreBis - now) / 1000) + ' Sekunden warten.';
    const h = await pinHash(pin);
    if (h === D.stammHash) ROLE = 'stamm';
    else if (D.ferien && h === D.ferien.hash) {
      const t = todayISO();
      if (t < D.ferien.von) return $('#err').textContent = 'Die Ferien-PIN gilt erst ab ' + fmtDate(D.ferien.von) + '.';
      if (t > D.ferien.bis) return $('#err').textContent = 'Die Ferien-PIN ist am ' + fmtDate(D.ferien.bis) + ' abgelaufen.';
      ROLE = 'ferien';
    }
    if (!ROLE) { D.versuche.n++; if (D.versuche.n >= 5) { D.versuche = { n: 0, sperreBis: now + 60000 }; } persist(); return $('#err').textContent = 'Falsche PIN.'; }
    D.versuche = { n: 0, sperreBis: 0 }; persist(); bumpIdle(); viewHome();
  });
}

/* ---------- Übersicht ---------- */
function viewHome() {
  if (!D.setup || !D.stammHash) return viewSetup();
  if (!ROLE) return viewLock();
  const visa = D.visa.slice().sort((a, b) => b.visiertAm.localeCompare(a.visiertAm));
  const neu = D.visa.filter(v => !D.letzterExport || v.visiertAm > D.letzterExport || (v.stornoAm && v.stornoAm > D.letzterExport)).length;
  const alt = D.letzterExport ? daysBetween(D.letzterExport.slice(0, 10), todayISO()) : null;
  app.innerHTML = `${head('Visum erteilen')}
  ${ROLE === 'ferien' ? `<div class="demo">Ferien-PIN gültig bis ${fmtDate(D.ferien.bis)} · eingeschränkte Rechte: visieren und exportieren</div>` : ''}
  ${neu && (alt === null || alt >= 7) ? `<div class="info">${neu} Visa noch nicht exportiert${alt !== null ? ' (letzter Export vor ' + alt + ' Tagen)' : ''}. Bitte exportieren und an die Administration senden.</div>` : ''}
  <button class="pri" id="sc" style="padding:18px;font-size:19px">QR-Code der Stellvertretung scannen</button>
  <button id="tp">Code eintippen</button>
  <div class="card" style="margin-top:18px"><h2>Erteilte Visa</h2>
    ${visa.length ? `<div class="list">${visa.slice(0, 40).map(v => `<div class="it" data-c="${v.code}"><div><div>${fmtDateShort(v.datum)} · ${esc(v.persNr)} · ${esc(v.funktion)}</div><div class="m">${minToHHMM(v.von)}–${minToHHMM(v.bis)} · visiert von ${esc(v.visiertVon)}${v.pinTyp === 'ferien' ? ' (Ferien-PIN)' : ''}</div></div>${v.storniert ? '<span class="bd b-err">storniert</span>' : '<span class="bd b-ok">✓</span>'}</div>`).join('')}</div>${visa.length > 40 ? '<p class="note">… und ' + (visa.length - 40) + ' ältere</p>' : ''}` : '<p class="sub">Noch keine Visa.</p>'}
  </div>
  <button class="dark" id="ex">Visa exportieren${neu ? ' (' + neu + ' neu)' : ''}</button>
  ${isStamm() ? `<div class="card" style="margin-top:18px"><h3 style="margin-top:0">Nur mit Stamm-PIN</h3>
    <div class="btngroup"><button class="small" id="fp">Ferien-PIN ${D.ferien ? 'verwalten' : 'erstellen'}</button>
    <button class="small" id="sp">Stamm-PIN ändern</button>
    <button class="small" id="re">Neuen Schlüssel einrichten</button></div></div>` : ''}
  <button id="lk">Sperren</button>`;
  $('#sc').onclick = async () => { const t = await scanQR('QR-Code der Stellvertretung scannen'); if (!t) return; if (!t.startsWith(QR_ENTRY)) return alert('Das ist kein Einsatz-Code der Stellvertretungs-App.'); checkCode(t.slice(QR_ENTRY.length)); };
  $('#tp').onclick = () => sheet(`<h2>Code eintippen</h2><label class="l">16 Zeichen, wie auf dem Handy der Stellvertretung</label>
    <input id="ci" class="mono" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" style="font-size:22px;letter-spacing:2px;text-align:center" placeholder="XXXX-XXXX-XXXX-XXXX">
    <div class="err" id="ce"></div><button class="pri" id="cok">Prüfen</button><button class="cl">Abbrechen</button>`,
    (el, close) => { codeInputBehaviour($('#ci', el)); $('.cl', el).onclick = close; $('#cok', el).onclick = () => { const r = unpackEntry($('#ci', el).value); if (r.err) return $('#ce', el).textContent = r.err; close(); checkCode(r.code); }; });
  $$('.it', app).forEach(el => el.onclick = () => viewVisum(el.dataset.c));
  $('#ex').onclick = exportVisa;
  $('#lk').onclick = viewLock;
  if (isStamm()) { $('#fp').onclick = viewFerien; $('#sp').onclick = () => viewNewPin(true); $('#re').onclick = () => viewSetup(true); }
}

/* ---------- Prüfen und visieren ---------- */
function checkCode(code) {
  const e = unpackEntry(code);
  if (e.err) return alert(e.err);
  const ex = D.visa.find(v => v.code === e.code && !v.storniert);
  if (ex) { toast('Dieser Einsatz ist bereits visiert'); return viewQuitt(ex); }
  const t = todayISO(), spaet = daysBetween(e.datum, t);
  let stop = '';
  if (e.standortNr !== D.setup.standortNr) stop = `Dieser Einsatz ist für <b>${esc(standortName(e.standortNr))}</b> erfasst. Hier ist ${esc(sName())}. Die Stellvertretung soll den Standort korrigieren.`;
  else if (e.datum > t) stop = 'Einsätze in der Zukunft können nicht visiert werden.';
  else if (spaet > CONFIG.maxNachtraeglichTage) stop = 'Der Einsatz liegt mehr als ' + CONFIG.maxNachtraeglichTage + ' Tage zurück. Bitte mit der Administration klären.';
  else if (ROLE === 'ferien' && (e.datum < D.ferien.von || e.datum > D.ferien.bis)) stop = 'Mit der Ferien-PIN können nur Einsätze während der Ferienbetreuung (' + fmtDateShort(D.ferien.von) + '–' + fmtDate(D.ferien.bis) + ') visiert werden.';
  app.innerHTML = `${head('Einsatz prüfen', 1)}
  <div class="card"><div style="margin-bottom:10px"><span class="bd b-ok">Code gültig</span> ${spaet >= CONFIG.nachtraeglichAbTagen ? '<span class="bd b-warn">nachträglich: ' + spaet + ' Tage später</span>' : ''}</div>
  <div class="kv"><div>Personalnummer</div><div><b>${e.persNr}</b></div><div>Datum</div><div>${fmtDate(e.datum)}</div><div>Zeit</div><div>${minToHHMM(e.von)}–${minToHHMM(e.bis)} (${hours(e.von, e.bis)} Std.)</div>
  <div>Funktion</div><div>${esc(e.funktion)}</div><div>Mittagessen</div><div>${e.mittag ? 'ja' : 'nein'}</div><div>Standort</div><div>${esc(standortName(e.standortNr))}</div></div></div>
  ${stop ? `<div class="info">${stop}</div><button id="back">Zurück</button>` : `
  <div class="card"><label class="l" style="margin-top:0">Visiert von (dein Name)</label><input id="vn" value="${esc(lastName)}" autocomplete="name"><div class="err" id="err"></div></div>
  <div class="btnrow"><button id="no">Stimmt nicht</button><button class="pri" id="ok">Visieren</button></div>`}`;
  $('#b0').onclick = viewHome;
  if (stop) return $('#back').onclick = viewHome;
  $('#no').onclick = () => { alert('Die Stellvertretung soll den Einsatz auf ihrem Handy korrigieren («Bearbeiten») und danach den neuen QR-Code zeigen.'); viewHome(); };
  $('#ok').onclick = async () => {
    const vn = $('#vn').value.trim(); if (vn.length < 3) return $('#err').textContent = 'Bitte deinen Namen eingeben.';
    lastName = vn;
    const v = { ...e, keyId: D.setup.keyId, visiertVon: vn, visiertAm: nowLocalISO(), pinTyp: ROLE, ferienVon: ROLE === 'ferien' ? D.ferien.von : '', ferienBis: ROLE === 'ferien' ? D.ferien.bis : '', nachtraeglichTage: spaet, storniert: false, stornoAm: '' };
    v.tag = await quittTag(D.setup.secret, v.code);
    v.sig = await visumSig(D.setup.secret, v);
    D.visa.push(v); persist(); viewQuitt(v);
  };
}
function viewQuitt(v) {
  const stamp = v.visiertAm.replace(/[-T:]/g, '');
  app.innerHTML = `${head('Quittung', 1)}
  <div class="card center"><div style="font-size:44px;color:#3B6D11;line-height:1">✓</div><div style="font-size:20px;font-weight:650;margin:4px 0 10px">Visum gespeichert</div>
  <div class="sub">Die Stellvertretung scannt jetzt diesen QR-Code</div>
  <div class="qrbox">${qrSVG(QR_QUITT + v.code + ':' + v.tag + ':' + stamp + ':' + encodeURIComponent(v.visiertVon))}</div>
  <div class="sub">Notlösung: Quittung zum Abtippen</div><div class="code" style="font-size:34px;letter-spacing:8px">${v.tag}</div>
  <button class="small" id="cq" style="margin-top:6px">Quittung kopieren</button>
  <p class="note">${v.persNr} · ${fmtDateShort(v.datum)} · ${minToHHMM(v.von)}–${minToHHMM(v.bis)} · ${esc(v.funktion)} · ${esc(v.visiertVon)}</p></div>
  <button class="pri" id="ok">Fertig</button>`;
  $('#ok').onclick = $('#b0').onclick = viewHome;
  $('#cq').onclick = () => copyText(v.tag);
}
function viewVisum(code) {
  const v = D.visa.filter(x => x.code === code).sort((a, b) => a.storniert - b.storniert)[0]; if (!v) return viewHome();
  app.innerHTML = `${head('Visum', 1)}
  <div class="card"><div class="kv"><div>Personalnummer</div><div>${v.persNr}</div><div>Datum</div><div>${fmtDate(v.datum)}</div><div>Zeit</div><div>${minToHHMM(v.von)}–${minToHHMM(v.bis)}</div>
  <div>Funktion</div><div>${esc(v.funktion)}</div><div>Mittagessen</div><div>${v.mittag ? 'ja' : 'nein'}</div><div>Visiert von</div><div>${esc(v.visiertVon)} · ${fmtStamp(v.visiertAm)}${v.pinTyp === 'ferien' ? ' (Ferien-PIN)' : ''}</div>
  <div>Quittung</div><div class="mono">${v.tag}</div>${v.storniert ? `<div>Storniert</div><div>${fmtStamp(v.stornoAm)}</div>` : ''}</div></div>
  ${v.storniert ? '' : '<button id="q">Quittung nochmals zeigen</button>'}
  ${isStamm() && !v.storniert ? '<button class="danger" id="st">Visum stornieren</button>' : ''}
  <button id="back">Zurück</button>`;
  $('#back').onclick = $('#b0').onclick = viewHome;
  if ($('#q')) $('#q').onclick = () => viewQuitt(v);
  if ($('#st')) $('#st').onclick = async () => {
    if (!confirm('Visum wirklich stornieren? Die Administration sieht den Einsatz dann als «Visum storniert».')) return;
    v.storniert = true; v.stornoAm = nowLocalISO(); v.sig = await visumSig(D.setup.secret, v); persist(); toast('Visum storniert'); viewHome();
  };
}

/* ---------- Ferien-PIN (nur Stamm) ---------- */
function viewFerien() {
  const f = D.ferien;
  app.innerHTML = `${head('Ferien-PIN', 1)}
  <div class="card"><p>Für die Ferienbetreuung, wenn niemand aus dem Leitungsteam vor Ort ist. Die Ferien-PIN</p>
  <ul style="margin:8px 0 0 20px;font-size:15px;color:var(--tx2)"><li>gilt nur im gewählten Zeitraum und läuft dann automatisch ab,</li><li>kann nur Einsätze aus diesem Zeitraum visieren und Visa exportieren,</li><li>kann keine Visa stornieren und keine PINs oder Schlüssel ändern.</li></ul>
  ${f ? `<div class="ok-box" style="margin-top:14px">Aktuelle Ferien-PIN gültig vom <b>${fmtDate(f.von)}</b> bis <b>${fmtDate(f.bis)}</b>${todayISO() > f.bis ? ' (abgelaufen)' : ''}.</div><button class="danger" id="del">Ferien-PIN löschen</button>` : ''}
  </div>
  <div class="card"><h2>${f ? 'Neue Ferien-PIN erstellen' : 'Ferien-PIN erstellen'}</h2>
  <div class="row2"><div><label class="l">Gültig ab</label><input type="date" id="fv" value="${todayISO()}"></div><div><label class="l">Gültig bis</label><input type="date" id="fb"></div></div>
  <label class="l">Ferien-PIN (4 Ziffern)</label><input id="fpin" inputmode="numeric" maxlength="4" class="mono" style="font-size:22px;letter-spacing:8px">
  <button class="small" id="gen" style="margin-top:8px">Zufällige PIN vorschlagen</button>
  <div class="err" id="err"></div><button class="pri" id="ok">Ferien-PIN speichern</button></div>
  <button id="back">Zurück</button>`;
  $('#back').onclick = $('#b0').onclick = viewHome;
  $('#gen').onclick = () => { let p; do { p = String(crypto.getRandomValues(new Uint32Array(1))[0] % 10000).padStart(4, '0'); } while (/^(\d)\1{3}$/.test(p)); $('#fpin').value = p; };
  if ($('#del')) $('#del').onclick = () => { if (confirm('Ferien-PIN löschen? Sie funktioniert dann sofort nicht mehr.')) { D.ferien = null; persist(); toast('Ferien-PIN gelöscht'); viewFerien(); } };
  $('#ok').onclick = async () => {
    const von = $('#fv').value, bis = $('#fb').value, pin = $('#fpin').value.trim(), err = m => $('#err').textContent = m;
    if (!von || !bis) return err('Bitte Zeitraum wählen.');
    if (bis < von) return err('«Gültig bis» liegt vor «Gültig ab».');
    if (daysBetween(von, bis) > 42) return err('Höchstens 6 Wochen am Stück.');
    if (bis < todayISO()) return err('Der Zeitraum liegt in der Vergangenheit.');
    if (!/^\d{4}$/.test(pin)) return err('Die PIN hat 4 Ziffern.');
    const h = await pinHash(pin); if (h === D.stammHash) return err('Die Ferien-PIN muss sich von der Stamm-PIN unterscheiden.');
    D.ferien = { hash: h, von, bis, erstellt: nowLocalISO() }; persist();
    alert('Ferien-PIN gespeichert. Gib sie der verantwortlichen Person der Ferienbetreuung weiter. Gültig ' + fmtDateShort(von) + '–' + fmtDate(bis) + '.');
    viewHome();
  };
}

/* ---------- Export ---------- */
async function exportVisa() {
  if (!D.visa.length) return alert('Noch keine Visa zum Exportieren.');
  const slug = sName().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const datei = `visa_${slug}_${todayISO()}.json`;
  const inhalt = { typ: 'leitung', version: 1, standortNr: D.setup.standortNr, standort: sName(), keyId: D.setup.keyId, exportiertAm: nowLocalISO(), exportiertMit: ROLE, visa: D.visa };
  const r = await shareOrDownload(datei, inhalt, 'Visa ' + sName());
  if (r === 'aborted') return;
  D.letzterExport = nowLocalISO(); persist();
  if (r === 'downloaded') toast('Datei gespeichert. Bitte per dienstlicher Mail an ' + CONFIG.adminEmail + ' senden.', 4500); else toast('Export erstellt');
  viewHome();
}

if (pendingSetup) viewSetup(!!(D.setup && D.stammHash)); else viewHome();
enableBottomBack();
</script></body></html>
